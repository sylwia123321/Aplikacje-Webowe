<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kontakt</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <header>
      <nav class="navbar">
        <div class="logo">Over the Garden Wall</div>
        <ul class="nav-links">
          <li><a href="index.html">Strona główna</a></li>
          <li><a href="galeria.html">Galeria</a></li>
          <li><a href="kontakt.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>

    <main class="main-container">
      <section class="contact-section">
        <h1>Formularz kontaktowy</h1>
        <p>Napisz do mnie wiadomość.</p>

        <form class="styled-form">
          <div class="form-group">
            <label for="email">E-Mail:</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Wpisz swój adres e-mail..."
              required
            />
          </div>

          <div class="form-group">
            <label for="subject">Temat wiadomości:</label>
            <select id="subject" name="subject" required>
              <option value="">Wybierz temat</option>
              <option value="serial">Informacje o serialu</option>
              <option value="galeria">Pytanie o galerię</option>
              <option value="inne">Inne</option>
            </select>
          </div>

          <div class="form-group">
            <label for="message">Wiadomość:</label>
            <textarea
              id="message"
              name="message"
              rows="5"
              placeholder="Twoja wiadomość..."
              required
            ></textarea>
          </div>

          <button type="submit" class="submit-btn">Wyślij</button>
        </form>
      </section>
    </main>
    <footer>
      <p>
        Sylwia Wójs. Strona internetowa stworzona na potrzeby przedmiotu
        Wprowadzenie do Aplikacji Internetowych 2026
      </p>
    </footer>
    <script src="index.js"></script>
  </body>
</html>
